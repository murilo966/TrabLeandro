<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Lista de Alunos na disciplina de Linguagem de Programação I</title>

    <style>
      body { font-family: Arial, sans-serif; margin: 40px; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 3px solid #ccc; padding: 10px; text-align: center; }
      th { background: #f0f0f0; }
    </style>
  </head>
  <body>

    <div id="mensagem"></div>

    <h2 id="titulo-form">Novo aluno</h2>
    <form id="form-aluno">
      <input type="hidden" id="id_aluno">
      <label>Matrícula <input type="text" id="matricula" required></label>
      <label>Nome <input type="text" id="nome" required></label>
      <label>CPF <input type="text" id="cpf" required></label>
      <label>Celular <input type="text" id="celular" required></label>
      <label>Código do Curso <input type="number" id="id_curso" required></label>
      <div class="botoes">
        <button type="submit" id="btn-salvar">Salvar</button>
      </div>
    </form>

    <h1>Lista de Alunos</h1>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Matrícula</th>
          <th>Nome</th>
          <th>CPF</th>
          <th>Celular</th>
          <th>Codigo Curso</th>
          <th>Curso</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabela-alunos"></tbody>
    </table>

    <script>

      async function carregarAlunos() {
        const tbody = document.getElementById('tabela-alunos');

        try {
          const resposta = await fetch('/api/alunos');
          const alunos = await resposta.json();

          if (!resposta.ok) {
            throw new Error(alunos.erro);
          }

          listaAlunos = alunos;

          tbody.innerHTML = alunos.map(a => `
            <tr>
              <td>${a.id_aluno}</td>
              <td>${a.matricula}</td>
              <td>${a.nome_aluno}</td>
              <td>${a.cpf}</td>
              <td>${a.celular ?? ''}</td>
              <td>${a.id_curso}</td>
              <td>${a.nome_curso}</td>
              <td><button onclick="editarAluno(${a.id_aluno})">Editar</button> <button onclick="deletarAluno(${a.id_aluno})">Deletar</button></td>
            </tr>`).join('');

        } catch (erro) {
          tbody.innerHTML = `<tr><td colspan="8">${erro.message}</td></tr>`;
        }
      }

      let listaAlunos = [];

      carregarAlunos();

      function editarAluno(id) {
        const a = listaAlunos.find(aluno => aluno.id_aluno == id);

        document.getElementById('id_aluno').value = a.id_aluno;
        document.getElementById('matricula').value = a.matricula;
        document.getElementById('nome').value = a.nome_aluno;
        document.getElementById('cpf').value = a.cpf;
        document.getElementById('celular').value = a.celular ?? '';
        document.getElementById('id_curso').value = a.id_curso;
        window.scrollTo(0, 0);
      }

      async function deletarAluno(id) {
        if (!confirm('Deseja realmente deletar este aluno?')){
          return;
        }

        const resposta = await fetch(`/api/alunos/${id}`, {
          method: "DELETE"
        });

        if (resposta.ok) {
          alert("Cadastro excluído!");
          carregarAlunos();
        } 
        
        else {
          alert("Erro ao excluir cadastro.");
        }
      }

      document.getElementById('form-aluno').addEventListener('submit', async (evento) => {
        evento.preventDefault();

        const id = document.getElementById('id_aluno').value;

        const aluno = {
          matricula: document.getElementById('matricula').value,
          nome: document.getElementById('nome').value,
          cpf: document.getElementById('cpf').value,
          celular: document.getElementById('celular').value,
          id_curso: document.getElementById('id_curso').value,
        };

        const metodo = id ? 'PUT' : 'POST';
        const endereco = id ? '/api/alunos/' + id : '/api/alunos';

        const resposta = await fetch(endereco, {
          method: metodo,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(aluno)
        });

        const resultado = await resposta.json();

        document.getElementById('mensagem').textContent =
          resultado.mensagem ?? resultado.erro;

        if (resposta.ok) {
          document.getElementById('form-aluno').reset();
          document.getElementById('id_aluno').value = '';
          document.getElementById('titulo-form').textContent = 'Novo aluno';
          carregarAlunos();
        }
    });
    </script>

  </body>
</html>
